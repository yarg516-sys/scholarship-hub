name: Daily AI Scholarship Research & Publishing Pipeline

on:
  schedule:
    # Run daily at 06:00 UTC (11:00 AM Pakistan Standard Time)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  research-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI Research & Verification Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ai_scholarship_pipeline.py

      - name: Commit & Publish Verified Scholarships to Website
        run: |
          if [[ -n $(git status --porcelain js/data.js index.html) ]]; then
            echo "Changes detected in scholarship catalog. Committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add js/data.js index.html
            git commit -m "🤖 AI Pipeline: Published newly verified scholarships [skip ci]"
            git push origin main
            echo "Successfully deployed new scholarships to GitHub Pages!"
          else
            echo "No new verified scholarships to publish today. Catalog is up to date."
          fi
